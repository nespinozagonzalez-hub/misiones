name: Ludaria central · pruebas del piloto
on:
  pull_request:
    paths:
      - 'ludaria/**'
      - 'forja/**'
      - 'vetas-diseno/**'
      - '.github/workflows/ludaria-central.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python ludaria/build.py
      - run: node --check forja/app.js && node --check ludaria/client.js && node --check vetas-diseno/app.js
      - run: node ludaria/test-gateway.cjs
      - run: node ludaria/test-server.cjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node ludaria/test-browser.cjs
      - run: node ludaria/test-gateway-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ludaria-piloto-capturas
          path: ludaria/preview-*.png
          if-no-files-found: ignore
