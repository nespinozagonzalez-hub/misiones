const root=document.getElementById('app'),overlay=document.getElementById('modal'),panel=document.getElementById('dialog');
const base='../',storage='ludaria_experiencia_preview_20261027';

{title:'Los Pergaminos Dispersos',kind:'Misión principal',desc:'Conceptos fundamentales de gamificación, ABJ, juegos serios y edutainment.',path:'pergaminos-dispersos/presentacion.html?v=20261004-epic1#pantalla-1',asset:'libro.webp'},

{title:'Los Planos del Arquitecto',kind:'Misión principal',desc:'Aplica el marco 6D y construye tu primer canvas.',path:'planos-arquitecto/presentacion.html?v=20261004-epic1#pantalla-1',asset:'libro.webp'},

{title:'El Espejo Compartido',kind:'Misión secundaria II',desc:'Presenta tu prototipo y recupera retroalimentación.',path:'espejo-compartido/index.html?v=20261004-epic1#pantalla-1',icon:'✧'}];

let state={opened:[],answers:Array(8).fill(''),page:'cover'};try{const s=JSON.parse(localStorage.getItem(storage)||'null');if(s){state={...state,...s};if(!Array.isArray(state.opened))state.opened=[];if(!Array.isArray(state.answers))state.answers=Array(8).fill('')}}catch{}
function store(){try{localStorage.setItem(storage,JSON.stringify(state))}catch{}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(label,fn,primary=false){return '<button class="btn '+(primary?'btn-primary':'')+'" data-action="'+fn+'">'+label+'</button>'}
function scene(k){state.page=k;store();let h='';if(k==='cover')h='<section class="screen"><div class="glass"><div class="gold">✧ &nbsp; L U D A R I A &nbsp; ✧</div><h1 class="hero-title">Buscadores<br>de la<br>Gamificación Perdida</h1><p class="lead">Una travesía por el conocimiento. Reúne los fragmentos, crea tu personaje y restaura el Orbe.</p><div class="controls">'+btn('COMIENZA →','portal',true)+btn('CONTINÚA LA AVENTURA','map')+'</div></div></section>';
else if(k==='portal')h='<section class="screen"><div class="glass"><h1 class="section-title">Portal de la Aventura</h1><p class="lead">Tu aventura comienza aquí. Crea tu personaje, conoce la historia de Ludaria y descubre las misiones que te esperan. Cuando estés listo, entra al Bosque de los Conceptos y comienza tu recorrido como buscador de la Gamificación Perdida.</p><div class="portal-grid"><div class="portal-card"><span class="portal-symbol">⚒</span>'+btn('Forja tu personaje','forja')+'</div><div class="portal-card"><span class="portal-symbol">📖</span>'+btn('Conoce la historia','story')+'</div><div class="portal-card"><span class="portal-symbol">✦</span>'+btn('Listado de misiones','list')+'</div></div><div class="controls" style="margin-top:28px">'+btn('← PORTADA','cover')+btn('IR AL MAPA →','map',true)+'</div></div></section>';
else h='<div class="map-stage"><div class="map-wrap"><img class="map-bg" src="'+mapImg+'" alt="Mapa fantástico original de Ludaria: castillo, bosques, cantera, portales y mercadito de Mochi" onerror="this.src=&quot;../mision-0/assets/valle.webp&quot;"><div class="map-shade"></div>'+[
['INICIO','cover','8%','10%','⌂','small'],['LA DEFENSA DEL ORBE','final','36%','8%','◈','small'],['MISIÓN 4','group3','68%','12%','✦',''],['FORJA TU PERSONAJE','forja','92%','9%','⚒','small'],['MISIÓN 1','group0','19%','34%','♧',''],['MISIÓN 2','group1','57%','52%','◆',''],['MISIÓN 3','group2','86%','32%','⚒',''],['MISIÓN 0','zero','21%','67%','◉',''],['MERCADITO DE MOCHI','mochi','9%','83%','✧','small']
].map(x=>'<button class="poi '+x[5]+'" style="--x:'+x[2]+';--y:'+x[3]+'" data-action="'+x[1]+'"><b>'+x[0]+'</b><span class="orb">'+x[4]+'</span></button>').join('')+'<div class="map-progress"><div class="bar"><div class="fill" style="width:'+progress()+'%"></div></div><strong>'+progress()+'%</strong></div></div></div><div class="map-foot"><button data-action="portal">☷ Portal</button> · <button data-action="list">Misiones</button> · <button data-action="reset">Reiniciar demo</button></div>';
root.innerHTML=h}
function progress(){return Math.min(100,Math.round((state.opened.length/14)*100))}
function show(title,content){panel.innerHTML='<button class="close" aria-label="Cerrar" data-action="close">×</button><h2 id="dialog-title">'+title+'</h2>'+content;overlay.hidden=false;document.body.style.overflow='hidden';panel.focus()}

function path(p){return '../'+p}
function mission(index){const d=data[index];if(!d)return;const k='m'+index;if(!state.opened.includes(k)){state.opened.push(k);store()}show(d.title,iframe(d.title,path(d.path)))}
function group(i){const g=groups[i];show('MISIÓN '+(i+1)+' · '+g.name,'<p class="modal-lead">Escoge tu camino: misión principal y dos misiones secundarias. Son las actividades originales de la tesis, no versiones sustitutas.</p><div class="task-grid">'+g.arr.map((idx,j)=>{const d=data[idx];return '<article class="task '+(j===0?'main':'')+'"><div class="art">'+(d.asset?'<img src="../forja/assets/'+d.asset+'" alt="">':d.icon)+'</div><div class="gold">'+esc(d.kind)+'</div><h3>'+esc(d.title)+'</h3><p>'+esc(d.desc)+'</p>'+btn('INICIAR MISIÓN →','mission'+idx,j===0)+'</article>'}).join('')+'</div>'+btn('← Volver al mapa','close'))}
function portalStory(){show('La historia de Ludaria','<p class="modal-lead">Una introducción narrativa a la aventura y su recorrido por los cuatro territorios. Video compartido para esta versión de la experiencia.</p><iframe class="video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="Introducción narrada de Ludaria" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/I8Wya9-TaP0"></iframe><p class="status">Si YouTube no reproduce el video aquí, <a href="https://youtu.be/I8Wya9-TaP0" target="_blank" rel="noopener" style="color:#ead09a">puedes abrirlo directamente</a>.</p>')}
function list(){show('Listado de misiones','<p class="modal-lead">14 sesiones · 12 misiones en cuatro territorios · apertura y defensa final. Abre un territorio para escoger las tres rutas.</p><div class="chapter-grid">'+groups.map((g,i)=>'<button class="chapter" data-action="group'+i+'"><small>'+g.subtitle+'</small><strong>'+g.name+'</strong><small>'+g.arr.map(j=>data[j].title).join(' · ')+'</small></button>').join('')+'<button class="chapter" data-action="zero"><small>APERTURA</small><strong>Valle de los Ecos</strong><small>Registro inicial · Misión 0</small></button><button class="chapter" data-action="final"><small>CIERRE</small><strong>La Defensa del Orbe</strong><small>La batalla final y los instrumentos</small></button></div>')}
function zero(){show('MISIÓN 0 · El Llamado de la Aventura',iframe('Misión 0 · Registro inicial',path('mision-0/presentacion.html?v=20261004-epic1')))}

function run(action){if(action==='close'){close();return}if(action==='cover'||action==='portal'||action==='map'){close();scene(action);return}if(action==='story'){portalStory();return}if(action==='list'){list();return}if(action==='zero'){zero();return}if(action==='forja'){forja(false);return}if(action==='mochi'){forja(true);return}if(action==='final'){final();return}if(action==='reset'){if(confirm('¿Reiniciar únicamente los indicadores de esta vista? No modifica los datos reales.')){state.opened=[];store();scene('map')}return}if(/^group[0-3]$/.test(action)){group(Number(action.slice(-1)));return}if(/^mission(?:[0-9]|1[01])$/.test(action)){mission(Number(action.slice(7)));return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)run(b.dataset.action);else if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)close()});scene(state.page==='map'?'map':state.page==='portal'?'portal':'cover');
})();
